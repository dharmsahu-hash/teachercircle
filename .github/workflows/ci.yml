name: CI

# Runs on every push to stage/main and on PRs into them. Branch flow: work is
# pushed to stage, checked here, then merged into main by hand.
on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, unit, build, system (fake backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this workflow pushes; don't leave a token on disk.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Node 24+: unit tests use mock.module({ exports }) and
          # --experimental-strip-types.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
      # Tier 2 starts `next start` on the build above against tests/fakes.
      - run: npm run test:system

  real-stack:
    name: System (real Postgres + GoTrue + PostgREST)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^DB_PASSWORD=$/DB_PASSWORD=$(openssl rand -hex 24)/" \
            -e "s/^JWT_SECRET=$/JWT_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^MEILI_MASTER_KEY=$/MEILI_MASTER_KEY=$(openssl rand -hex 24)/" \
            -e "s/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)/" \
            .env

      # Postgres first, on its own. On a fresh volume the supabase/postgres
      # entrypoint sometimes exits once ("Peer authentication failed") and is
      # restarted by `restart: unless-stopped`; a single `up` of the whole
      # stack sees that exit through depends_on and fails the job. Waiting here
      # tolerates the restart.
      - name: Start postgres, wait until healthy, bootstrap
        run: |
          docker compose up -d postgres
          for i in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q postgres)")" = healthy ] && break
            sleep 2
          done
          docker inspect -f 'postgres: {{.State.Health.Status}}, restarts {{.RestartCount}}' "$(docker compose ps -q postgres)"
          sh db/bootstrap.sh

      # MinIO is not used by app code (AGENTS.md) and its image is no longer
      # publicly pullable, so it is left out.
      - name: Start the rest of the stack
        run: docker compose up -d --build postgrest gotrue meilisearch redis app

      # GoTrue crash-loops until bootstrap has run, then recovers on its own.
      - name: Wait for gotrue, then migrate and seed
        run: |
          for i in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q gotrue)")" = healthy ] && break
            sleep 4
          done
          sh db/run-migrations.sh
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U teachercircle -d postgres < db/seed.sql

      # /api/health returns 200 only once the app can reach both PostgREST
      # and GoTrue, so this also waits out PostgREST's schema reload.
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "app did not become healthy"; curl -s http://localhost:3000/api/health; exit 1

      - run: npm run test:system:real

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
