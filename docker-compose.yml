name: teachercircle

services:
  postgres:
    # Real findings from running Tier 3 end to end: GoTrue's bundled
    # migrations assume things no plain postgres:16-alpine image provides,
    # and — surprisingly — that even supabase/postgres (tried both
    # 15.1.0.147 and this newer 15.8.1.060) doesn't provide either: the
    # `auth` schema itself, and a role literally named `postgres` (Supabase
    # convention, hardcoded into one migration). A THIRD issue looked like a
    # missing `auth.factor_type` enum, but that was actually a search_path
    # problem: several of GoTrue's own migrations create objects with
    # UNqualified names (`create type factor_type ...`, bare `identities`
    # queries at runtime) and rely on the connecting role's search_path
    # already including `auth` — which the shared `teachercircle` role can't
    # safely have (this app's own `public.users` would collide with
    # `auth.users` under unqualified lookups). See gotrue's own
    # GOTRUE_DB_DATABASE_URL below for the real fix: a dedicated connection
    # role. The schema/role fixes still need db/init/*.sql applied manually —
    # see the note on `volumes` below: run `./db/bootstrap.sh` once, right
    # after this container reports healthy. GoTrue crash-loops harmlessly
    # (restarts and retries on its own) until you do.
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      # Another finding from Tier 3: this image does not honor a custom
      # POSTGRES_DB name the way plain postgres:16-alpine does — it always
      # provisions the database named "postgres" (the standard single-project
      # Supabase convention). Every connection string below targets
      # `/postgres`, not `/teachercircle`, for that reason.
      POSTGRES_DB: postgres
      POSTGRES_USER: teachercircle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted per the standard Postgres convention, but confirmed NOT to
      # auto-run on this image (no matching log lines on a fresh volume,
      # despite the files being present and readable inside the container) —
      # supabase/postgres's own entrypoint doesn't honor it. Kept mounted as
      # a harmless no-op; `./db/bootstrap.sh` is what actually applies these.
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachercircle"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotrue:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      # gotrue_conn, not teachercircle — see db/init/02-gotrue-connection-role.sql
      # for why GoTrue needs its own connection role with search_path=auth.
      GOTRUE_DB_DATABASE_URL: postgres://gotrue_conn:${DB_PASSWORD}@postgres:5432/postgres
      # Found running the real image (Tier 3 testing) — required, not
      # documented as such anywhere obvious: GoTrue refuses to boot at all
      # without this ("required key API_EXTERNAL_URL missing value"). It's
      # the externally-reachable base URL for GoTrue itself, distinct from
      # GOTRUE_SITE_URL (the app's own URL, used for post-auth redirects).
      # Confirmed by testing the image directly: unlike every other GoTrue
      # setting, this one is NOT prefixed GOTRUE_ — `GOTRUE_API_EXTERNAL_URL`
      # is silently ignored and still fails the same required-key check.
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_SITE_URL: http://${APP_HOSTNAME}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      # Local dev only: skips the email-confirmation link since no SMTP is configured.
      # Set to "false" and configure GOTRUE_SMTP_* before going anywhere near production.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Local dev (no reverse proxy in front): Google must redirect straight to
      # GoTrue's own port, not through the Next.js app. Register this exact URL
      # in Google Cloud Console. In production, Caddy proxies /auth/* to GoTrue
      # on the same origin, so this becomes https://yourdomain/auth/v1/callback.
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:9999/callback
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://teachercircle:${DB_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  minio:
    # Real-world drift found while running this stack: minio/minio on Docker
    # Hub now requires `docker login` to pull ("pull access denied ...").
    # MinIO's own quay.io mirror has the same tag, no auth needed.
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgrest
      - gotrue
      - meilisearch
      - redis
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Overrides for the values in .env that differ between "the app container
      # talking to other containers" and "your browser talking to the host".
      POSTGREST_URL: http://postgrest:3000
      GOTRUE_URL: http://gotrue:9999
      MEILISEARCH_URL: http://meilisearch:7700
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:
  meilidata:
  miniodata:
